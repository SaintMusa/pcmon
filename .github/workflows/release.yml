# Pushing a tag such as v1.2.0 builds pcmon and publishes a GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-2025
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and package
        shell: pwsh
        run: ./build.ps1 -Version $env:TAG.TrimStart('v') -Package

      - name: Check the build
        shell: pwsh
        run: |
          $reported = & ./dist/pcmon.exe --version
          if ($reported -ne "pcmon $($env:TAG.TrimStart('v'))") { throw "Unexpected version: $reported" }
          & ./dist/pcmon.exe --snapshot 1 --size 120 30
          if ($LASTEXITCODE -ne 0) { throw 'pcmon failed to run' }

      - name: Record where the zip was built
        uses: actions/attest@v4
        with:
          subject-path: dist/*.zip

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist/*.zip, dist/*.sha256).FullName
          gh release create $env:TAG @files --title "pcmon $env:TAG" --generate-notes --verify-tag
